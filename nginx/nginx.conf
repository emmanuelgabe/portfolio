user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" '
    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # Production traffic comes through a Cloudflare Tunnel: cloudflared runs on the host and
    # reaches nginx through the Docker gateway. Only then is the visitor address sent by
    # Cloudflare trusted; clients connecting directly keep their own address and cannot spoof it.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # Allow file uploads up to 20MB
    client_max_body_size 20M;

    include /etc/nginx/conf.d/*.conf;
}
