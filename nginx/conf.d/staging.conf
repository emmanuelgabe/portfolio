# X-Forwarded-For only carries the visitor address resolved in nginx.conf: client-supplied
# values are dropped so that the backend IP-based rate limits cannot be bypassed.
# Host keeps the client port (staging is served on :3000): without it the backend sees the
# browser Origin as another site and rejects same-origin calls as invalid CORS requests.

server {
    listen 80;
    server_name localhost;

    # Add staging identifier header
    add_header X-Environment "Staging" always;

    location / {
        proxy_pass http://angular-frontend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # WebSocket support (useful for Angular dev features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://spring-backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Serve uploaded files (images, CVs, etc.) from backend
    location /uploads/ {
        proxy_pass http://spring-backend:8080/uploads/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint - Simple
    location /health {
        access_log off;
        return 200 "Staging is healthy\n";
        add_header Content-Type text/plain;
    }

    # Full health check - Tests entire chain
    location /health/full {
        access_log off;
        proxy_pass http://spring-backend:8080/api/health/status;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }
}